name: DownPayment Desk safety check
# Target site: config.json (site_base). Public repo: Actions minutes are free and unlimited. Standard-library Python only.
# GitHub delays or drops scheduled runs at busy times (plain hourly cron here ran only every 2-5 h), so the schedule fires
# four times an hour and a gate skips the run if a check already finished in the last 40 minutes => about one real check per hour.
# The full check (adds every outbound link) runs on the first scheduled run after 14:00 UTC each day, or whenever the
# last full run is more than 26 h old, so a dropped run can't skip the daily link check.
# The full run also runs seo_check.py (daily technical SEO: one request at a time, 1.5 s apart, stops at the first 403);
# a real SEO problem fails the run with an SEO_ALERT summary.
# Status JSON -> branch `status` (status.json, last_full.txt). Any failure fails the run and the summary starts with SAFETY_ALERT.
on:
  schedule:
    - cron: "11 * * * *"
    - cron: "26 * * * *"
    - cron: "41 * * * *"
    - cron: "56 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "quick or full (full also checks outbound links)"
        default: full
        type: choice
        options: [quick, full]
permissions:
  contents: write   # only to publish status.json / last_full.txt on the status branch
concurrency:
  group: dpd-safety-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # quick runs take ~1 min; the daily full run adds the SEO check (~5 min)
    env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
    steps:
      - name: Gate (skip if a check ran in the last 40 min; pick quick or full)
        id: gate
        run: |
          get() { gh api "repos/$R/contents/$1?ref=status" --jq .content 2>/dev/null | base64 -d 2>/dev/null; }
          NOW=$(date -u +%s)
          LAST=$(get status.json | python3 -c "import sys,json,datetime as d;print(int(d.datetime.fromisoformat(json.load(sys.stdin)['checked_at'].replace('Z','+00:00')).timestamp()))" 2>/dev/null || echo 0)
          LFULL=$(get last_full.txt | tr -dc 0-9); LFULL=${LFULL:-0}
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=1" >> $GITHUB_OUTPUT; echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT; exit 0; fi
          if [ $((NOW-LAST)) -lt 2400 ]; then echo "Skip: last check $(( (NOW-LAST)/60 )) min ago"; exit 0; fi
          MODE=quick; H=$(date -u +%H); TODAY14=$(date -u -d "$(date -u +%F) 14:00" +%s)
          if { [ "$H" -ge 14 ] && [ "$LFULL" -lt "$TODAY14" ]; } || [ $((NOW-LFULL)) -gt 93600 ]; then MODE=full; fi
          echo "run=1" >> $GITHUB_OUTPUT; echo "mode=$MODE" >> $GITHUB_OUTPUT; echo "Running $MODE"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == '1'
        with: { persist-credentials: false }
      - name: Run safety check
        id: check
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        env:
          SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
        run: python3 check.py "${{ steps.gate.outputs.mode }}"
      - name: Run SEO check (daily, full runs only)
        id: seo
        if: steps.gate.outputs.run == '1' && steps.gate.outputs.mode == 'full'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 seo_check.py --json seo-report.json | tee seo-report.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.seo.outcome != 'skipped' && steps.gate.outputs.run == '1'
        with: { name: seo-report, path: "seo-report.*", retention-days: 14, if-no-files-found: ignore }
      - name: Publish status (status branch)
        if: always() && steps.gate.outputs.run == '1'
        run: |
          put() { F="$1"; N="$2"; B64=$(base64 -w0 "$F")
            for i in 1 2 3; do SHA=$(gh api "repos/$R/contents/$N?ref=status" --jq .sha 2>/dev/null || true)
              gh api -X PUT "repos/$R/contents/$N" -f message="status $(date -u +%FT%TZ)" -f branch=status -f content="$B64" ${SHA:+-f sha="$SHA"} --silent && return 0; sleep $((i*3)); done
            echo "::warning::could not publish $N"; }
          [ -f status.json ] && put status.json status.json
          if [ "${{ steps.gate.outputs.mode }}" = "full" ] && [ "${{ steps.check.outcome }}" != "skipped" ]; then date -u +%s > last_full.txt; put last_full.txt last_full.txt; fi
      - name: Fail on any problem
        if: steps.gate.outputs.run == '1' && (steps.check.outcome != 'success' || steps.seo.outcome == 'failure')
        run: |
          [ "${{ steps.check.outcome }}" != "success" ] && echo "SAFETY_ALERT (see the run summary)"
          [ "${{ steps.seo.outcome }}" = "failure" ] && { echo "SEO_ALERT (see the run summary)"; grep -E '^\s*\[FAIL\]' seo-report.txt || true; }
          exit 1
